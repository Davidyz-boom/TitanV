<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN V - Acceso</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="auth-container">
        <div class="logo">TITAN <span>V</span></div>

        <!-- Caja de Inicio de Sesión -->
        <div id="loginBox" class="form-box active">
            <h2>Bienvenido de nuevo</h2>
            <form onsubmit="handleAuth(event, 'main')">
                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <i class="fas fa-envelope"></i>
                    <input type="email" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-auth">Iniciar Sesión</button>
            </form>

            <!-- Botón de Inicio de Sesión con Google -->
            <button type="button" id="btnGoogle" class="btn-auth" style="background-color: #ffffff; color: #333333; margin-top: 10px; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <i class="fab fa-google" style="color: #db4437;"></i> Iniciar sesión con Google
            </button>

            <div class="switch-form">
                <p><a onclick="showForm('recoverBox')">¿Olvidaste tu contraseña?</a></p>
                <p>¿No tienes cuenta? <a onclick="showForm('registerBox')">Regístrate aquí</a></p>
            </div>
        </div>

        <!-- Caja de Registro -->
        <div id="registerBox" class="form-box">
            <h2>Crear Cuenta</h2>
            <form onsubmit="handleAuth(event, 'login')">
                <div class="input-group">
                    <label>Nombre Completo</label>
                    <i class="fas fa-user"></i>
                    <input type="text" placeholder="Tu nombre" required>
                </div>
                <div class="input-group">
                    <label>Número de Documento</label>
                    <i class="fas fa-id-card"></i>
                    <input type="number" placeholder="C.C / NIT" required>
                </div>
                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <i class="fas fa-envelope"></i>
                    <input type="email" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="Crear contraseña" required>
                </div>
                <button type="submit" class="btn-auth">Registrarse</button>
            </form>
            <div class="switch-form">
                <p>¿Ya tienes cuenta? <a onclick="showForm('loginBox')">Inicia sesión</a></p>
            </div>
        </div>

        <!-- Caja de Recuperación de Contraseña -->
        <div id="recoverBox" class="form-box">
            <h2>Recuperar Contraseña</h2>
            <form onsubmit="handleRecover(event)">
                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <i class="fas fa-envelope"></i>
                    <input type="email" placeholder="correo@ejemplo.com" required>
                </div>
                <button type="submit" class="btn-auth">Enviar enlace</button>
            </form>
            <div class="switch-form">
                <p><a onclick="showForm('loginBox')">Volver al inicio</a></p>
            </div>
        </div>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
